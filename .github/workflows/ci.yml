name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:docker
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Start isolated integration database
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          export POSTGRES_PASSWORD="$password"
          docker run --detach --name ci-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD --env POSTGRES_USER=ci_user --env POSTGRES_DB=chat_test \
            --health-cmd 'pg_isready -U ci_user -d chat_test' \
            --health-interval 2s --health-timeout 3s --health-retries 20 \
            postgres:18.6-bookworm
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' ci-postgres)" = healthy ]; then
              echo "TEST_DATABASE_URL=postgresql://ci_user:$password@127.0.0.1:5432/chat_test" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: npm run test:integration --workspace @real-time-chat/api
      - name: Database diagnostics
        if: failure()
        run: docker logs ci-postgres
      - name: Remove integration database
        if: always()
        run: docker rm --force --volumes ci-postgres || test -z "$(docker ps -aq --filter name=^/ci-postgres$)"

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ci-chat
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Generate temporary Compose configuration
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf 'POSTGRES_DB=ci_chat\nPOSTGRES_USER=ci_user\nPOSTGRES_PASSWORD=%s\n' "$password" > .env
      - name: Build images and start the application
        run: docker compose up --build --wait --wait-timeout 120
      - name: Verify the public health endpoint
        run: test "$(curl --fail --silent --show-error http://127.0.0.1:8080/api/health/live)" = '{"status":"ok"}'
      - name: Application diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100
      - name: Remove temporary stack
        if: always()
        run: docker compose down --volumes --remove-orphans
