name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:docker
      - run: npm run build
      - run: npm audit --audit-level=high

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ci-integration-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Generate temporary integration credentials
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "TEST_POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build integration tools in the test image
        run: docker compose -f compose.test.yaml build integration
      - name: Run integration against fresh PostgreSQL databases
        id: integration
        run: docker compose -f compose.test.yaml run --rm integration
      - name: Verify cleanup after forward integration
        if: always() && (steps.integration.outcome == 'success' || steps.integration.outcome == 'failure')
        shell: bash
        run: |
          test "$(docker compose -f compose.test.yaml exec -T db psql -U integration -d chat_integration_test -tAc "SELECT count(*) FROM pg_database WHERE datname LIKE 'suite_%_test'")" = 0
          test "$(docker compose -f compose.test.yaml exec -T db psql -U integration -d chat_integration_test -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")" = 0
      - name: Repeat integration in reverse order
        id: reverse
        run: docker compose -f compose.test.yaml run --rm -e INTEGRATION_ORDER=reverse integration
      - name: Verify cleanup after reverse integration
        if: always() && (steps.reverse.outcome == 'success' || steps.reverse.outcome == 'failure')
        shell: bash
        run: |
          test "$(docker compose -f compose.test.yaml exec -T db psql -U integration -d chat_integration_test -tAc "SELECT count(*) FROM pg_database WHERE datname LIKE 'suite_%_test'")" = 0
          test "$(docker compose -f compose.test.yaml exec -T db psql -U integration -d chat_integration_test -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")" = 0
      - name: Safe integration diagnostics
        if: failure()
        run: docker compose -f compose.test.yaml ps -a && docker compose -f compose.test.yaml logs --tail 100 db
      - name: Remove temporary integration stack
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ci-chat
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Generate temporary Compose configuration
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf 'POSTGRES_DB=ci_chat\nPOSTGRES_USER=ci_user\nPOSTGRES_PASSWORD=%s\nAPP_ORIGIN=http://localhost:8080\nSEND_LIMIT=1000\nLOGIN_LIMIT=1000\nREGISTER_LIMIT=1000\nCHANNEL_CREATE_LIMIT=1000\n' "$password" > .env
      - name: Build images and start the application
        run: docker compose up --build --wait --wait-timeout 120
      - name: Verify the public health endpoint
        run: test "$(curl --fail --silent --show-error http://127.0.0.1:8080/api/health/live)" = '{"status":"ok"}'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify browser identity flows against the real API
        id: browser
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_COMPOSE_PROJECT: ci-chat
          E2E_COMPOSE_ENV_FILE: .env
      - name: Verify repeated keyboard and channel navigation
        run: npx playwright test e2e/keyboard.spec.ts e2e/responsive.spec.ts --repeat-each=3
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_COMPOSE_PROJECT: ci-chat
          E2E_COMPOSE_ENV_FILE: .env
      - name: Keep desktop and mobile usability screenshots
        if: always() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/keyboard-desktop.png
            test-results/**/responsive-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Application diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100
      - name: Remove temporary stack
        if: always()
        run: docker compose down --volumes --remove-orphans
